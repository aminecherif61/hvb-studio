# Netlify configuration — Hamdi Van Buuren (Next.js App Router)
# The official Next.js runtime handles the build output, SSR/ISR routing,
# next/image optimization and the .next publish directory automatically.

[build]
  # Schema + admin are created once at runtime via the secret-protected
  # /api/admin/bootstrap endpoint, which connects with the pooled Neon URL that
  # the Netlify DB extension injects into CI-built functions. (Prisma's own
  # schema push needs a direct connection, so it is intentionally not in the
  # build.)
  command = "prisma generate && next build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Match the local toolchain; keeps the remote build reproducible.
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# ---------------------------------------------------------------------------
# Caching — Next.js fingerprints these assets, so they are safe to cache hard.
# Security headers are set in next.config.ts so they reach every route,
# including server-rendered HTML. HTML/data routes keep the runtime defaults.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
